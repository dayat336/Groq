<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groq Chat</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #262d38; --text: #e6edf3;
    --muted: #8b949e; --accent: #f55036; --accent2: #ff8a5c; --user: #1f2a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header { padding: 12px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand {
    font-weight: 700; font-size: 18px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .status { font-size: 12px; color: var(--muted); }
  .status.ok { color: #3fb950; }
  input, select, textarea, button {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  button { cursor: pointer; background: var(--line); white-space: nowrap; }
  button.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: #fff; font-weight: 600;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; }
  .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .view.active { display: flex; }
  .toolbar { padding: 10px 14px; display: flex; gap: 8px; border-bottom: 1px solid var(--line); }
  .toolbar select { flex: 1; min-width: 0; }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px 14px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .msg {
    max-width: 88%; padding: 10px 14px; border-radius: 16px; line-height: 1.55;
    font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.err { border-color: #f85149; color: #ff938c; }
  .msg img { display: block; max-width: 100%; max-height: 220px; border-radius: 10px; margin-bottom: 8px; }
  .msg pre {
    background: #0a0d12; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; margin: 8px 0; overflow-x: auto; white-space: pre;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
  }
  .msg code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  .msg :not(pre) > code { background: #0a0d12; padding: 1px 5px; border-radius: 4px; }
  footer { padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); }
  #preview { display: none; align-items: center; gap: 10px; margin-bottom: 8px; }
  #preview.show { display: flex; }
  #preview img { height: 56px; width: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  #preview span { flex: 1; font-size: 12px; color: var(--muted); }
  #prompt { flex: 1; min-width: 0; resize: none; max-height: 120px; }
  .attach { padding: 10px 12px; }
</style>
</head>
<body>

<header>
  <div class="top">
    <span class="brand">⚡ Groq Chat</span>
    <span class="status" id="status"></span>
  </div>
</header>

<!-- ================= TAB CHAT ================= -->
<section class="view active" id="chatView">
  <div class="toolbar">
    <select id="model"></select>
    <button id="clear">Hapus chat</button>
  </div>
  <div id="chat">
    <div class="empty" id="empty">Ketik pesan, atau tekan 📎 untuk<br>mengirim foto ke AI. 🚀</div>
  </div>
  <footer>
    <div id="preview">
      <img id="previewImg" alt="">
      <span>Foto siap dikirim</span>
      <button id="removeImg">✕</button>
    </div>
    <div class="row">
      <button class="attach" id="attachBtn" title="Kirim foto">📎</button>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <textarea id="prompt" rows="1" placeholder="Tulis pesan..."></textarea>
      <button class="primary" id="send">Kirim</button>
    </div>
  </footer>
</section>

<script>
  // =====================================================================
  //  KONFIGURASI — ISI BAGIAN INI
  // =====================================================================
  const CONFIG = {
    // --- Groq (chat + baca foto) ---
    GROQ_API_KEY: "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",
    GROQ_CHAT_ENDPOINT: "https://api.groq.com/openai/v1/chat/completions",
    GROQ_MODELS_ENDPOINT: "https://api.groq.com/openai/v1/models",
    TEXT_MODEL: "llama-3.3-70b-versatile",
    // Model yang bisa membaca foto. Cek nama terbaru di console.groq.com/docs/vision
    VISION_MODEL: "qwen/qwen3.6-27b"
  };
  // =====================================================================

  const $ = (id) => document.getElementById(id);
  const isPlaceholder = (v) => !v || v.includes("ISI_");

  // ---------- status ----------
  const statusEl = $("status");
  function updateStatus() {
    const ok = !isPlaceholder(CONFIG.GROQ_API_KEY);
    statusEl.textContent = ok ? "Groq siap" : "API key belum diisi";
    statusEl.className = "status" + (ok ? " ok" : "");
  }
  updateStatus();

  // ---------- util ----------
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function render(text) {
    let h = escapeHtml(text);
    h = h.replace(/```(?:\w+)?\n?([\s\S]*?)```/g, (_, c) => "<pre><code>" + c + "</code></pre>");
    h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    h = h.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
    return h;
  }
  function autoGrow(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 120) + "px";
  }

  // Perkecil foto supaya ringan dikirim (maks 1280px, JPEG)
  function fileToDataUrl(file, max = 1280) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * s), h = Math.round(img.height * s);
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = () => reject(new Error("Gagal membaca foto"));
      img.src = url;
    });
  }

  // =====================================================================
  //  BAGIAN 1 — CHAT + KIRIM FOTO KE GROQ
  // =====================================================================
  const chat = $("chat"), model = $("model");
  const promptEl = $("prompt"), sendBtn = $("send");
  let history = [];          // pesan untuk API
  let pendingImage = null;   // foto yang menunggu dikirim
  let busy = false;

  model.add(new Option(CONFIG.TEXT_MODEL, CONFIG.TEXT_MODEL));
  let visionModel = CONFIG.VISION_MODEL;

  // muat daftar model dari Groq (jalan otomatis) + pilih model foto yang masih aktif
  (async () => {
    if (isPlaceholder(CONFIG.GROQ_API_KEY)) return;
    try {
      const r = await fetch(CONFIG.GROQ_MODELS_ENDPOINT, {
        headers: { Authorization: "Bearer " + CONFIG.GROQ_API_KEY }
      });
      if (!r.ok) return;
      const all = (await r.json()).data.map((m) => m.id);
      if (!all.includes(visionModel)) {
        const v = all.find((id) => /llama-4-(scout|maverick)/i.test(id)) ||
                  all.find((id) => /vision/i.test(id));
        if (v) visionModel = v;
      }
      const ids = all
        .filter((id) => !/whisper|guard|tts|playai|vision-preview|orpheus/i.test(id)).sort();
      model.innerHTML = "";
      ids.forEach((id) => model.add(new Option(id, id)));
      model.value = ids.includes(CONFIG.TEXT_MODEL) ? CONFIG.TEXT_MODEL : ids[0];
    } catch (e) {}
  })();

  function addMsg(html, cls, isHtml) {
    const e = $("empty"); if (e) e.remove();
    const div = document.createElement("div");
    div.className = "msg " + cls;
    if (isHtml) div.innerHTML = html; else div.textContent = html;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  $("clear").onclick = () => {
    history = [];
    chat.innerHTML = '<div class="empty" id="empty">Chat dihapus. Mulai lagi! ✨</div>';
  };

  // pilih / hapus foto
  $("attachBtn").onclick = () => $("fileInput").click();
  $("fileInput").onchange = async (e) => {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    try {
      pendingImage = await fileToDataUrl(f);
      $("previewImg").src = pendingImage;
      $("preview").classList.add("show");
    } catch (err) {
      addMsg("Error: " + err.message, "ai err");
    }
  };
  function clearPending() {
    pendingImage = null;
    $("preview").classList.remove("show");
    $("previewImg").removeAttribute("src");
  }
  $("removeImg").onclick = clearPending;

  async function send() {
    const text = promptEl.value.trim();
    if ((!text && !pendingImage) || busy) return;
    if (isPlaceholder(CONFIG.GROQ_API_KEY)) {
      return addMsg("Isi GROQ_API_KEY di bagian CONFIG dulu.", "ai err");
    }

    busy = true; sendBtn.disabled = true;
    const image = pendingImage;
    promptEl.value = ""; autoGrow(promptEl); clearPending();

    // tampilan bubble user
    let shown = "";
    if (image) shown += '<img src="' + image + '" alt="foto">';
    shown += escapeHtml(text);
    addMsg(shown, "user", true);

    // isi pesan untuk API (format vision OpenAI-compatible)
    const content = image
      ? [
          { type: "text", text: text || "Jelaskan foto ini." },
          { type: "image_url", image_url: { url: image } }
        ]
      : text;
    history.push({ role: "user", content });

    const hasImage = history.some((m) => Array.isArray(m.content));
    const useModel = hasImage ? visionModel : model.value;

    const bubble = addMsg("…", "ai");
    let full = "";
    try {
      const res = await fetch(CONFIG.GROQ_CHAT_ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + CONFIG.GROQ_API_KEY
        },
        body: JSON.stringify({ model: useModel, messages: history, stream: true })
      });
      if (!res.ok) {
        let msg = res.status + " " + res.statusText;
        try { msg = (await res.json()).error?.message || msg; } catch (e) {}
        throw new Error(msg);
      }
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();
        for (const line of lines) {
          const l = line.trim();
          if (!l.startsWith("data:")) continue;
          const p = l.slice(5).trim();
          if (p === "[DONE]") continue;
          try {
            const d = JSON.parse(p).choices?.[0]?.delta?.content;
            if (d) {
              full += d;
              bubble.innerHTML = render(full);
              chat.scrollTop = chat.scrollHeight;
            }
          } catch (e) {}
        }
      }
      history.push({ role: "assistant", content: full });
    } catch (e) {
      history.pop();
      bubble.className = "msg ai err";
      bubble.textContent = "Error: " + e.message;
    } finally {
      busy = false; sendBtn.disabled = false;
      promptEl.focus();
    }
  }

  sendBtn.onclick = send;
  promptEl.addEventListener("input", () => autoGrow(promptEl));
  promptEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 700) {
      e.preventDefault(); send();
    }
  });

</script>
</body>
</html>
